spring:
  kafka:
    bootstrap-servers: localhost:29092
    consumer:
      group-id: "notification-group"
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring:
          json:
            trusted:
              packages: '*'
    listener:
      # MANUAL_IMMEDIATE — ack сразу при вызове; MANUAL — после обработки всего пула
      ack-mode: MANUAL_IMMEDIATE
      # Количество потоков на каждый ConcurrentMessageListenerContainer
      concurrency: 3
      # Таймаут для poll() — после него Kafka считает консьюмера мёртвым
      poll-timeout: 3000
    topics:
      notification:
        name: notification
        partitions: 10
        replicas: 1

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  phone-number: ${TWILIO_PHONE_NUMBER:}

spring.mail:
  host: smtp.gmail.com
  port: 587
  username: ${GMAIL_USERNAME:}
  password: ${GMAIL_APP_PASSWORD:}
  properties:
    mail:
      smtp:
        auth: true
        starttls:
          enable: true
      transport:
        protocol: smtp

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: notification