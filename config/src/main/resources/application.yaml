server:
  port: 8888

spring:
  application:
    name: config-server

  cloud:
    config:
      server:
        native:
          searchLocations: classpath:/config
      label : main
  profiles:
    active: native

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8760/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
